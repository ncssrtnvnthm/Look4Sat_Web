name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/packages/web/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS domain module and run domain tests
        working-directory: web
        run: ./gradlew :packages:domain:jsBrowserProductionWebpack :packages:domain:jvmTest

      - name: Copy domain.js to public
        run: |
          mkdir -p web/packages/web/public/wasm
          cp web/packages/domain/build/kotlin-webpack/js/productionExecutable/domain.js web/packages/web/public/wasm/domain.js

      - name: Install web dependencies
        working-directory: web/packages/web
        run: npm ci

      - name: Type-check web app
        working-directory: web/packages/web
        run: npm run typecheck

      - name: Run web app tests
        working-directory: web/packages/web
        run: npm test

      # SatNOGS has no CORS headers, so bundle a fresh snapshot of the
      # transceiver database at deploy time (the app falls back to it in
      # production; see satelliteData.ts fetchTransceivers).
      - name: Bundle SatNOGS transceivers snapshot
        run: |
          mkdir -p web/packages/web/public/data
          curl -fsSL -A "Look4Sat/4.4.3" \
            "https://db.satnogs.org/api/transmitters/?format=json" \
            -o web/packages/web/public/data/transceivers.json || echo "snapshot download failed"

      - name: Build web app
        working-directory: web/packages/web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
